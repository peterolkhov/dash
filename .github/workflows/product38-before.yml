name: Product38 pinned Dash before diagnosis

on:
  push:
    branches: [codex/diagnose-patch-update-arguments]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-native-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic packet at the dispatched branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: packet
          persist-credentials: false

      - name: Checkout the unchanged whole upstream pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: plotly/dash
          ref: b5a33c5b9191bef976e352b9feca14eaf93c9b7a
          path: upstream
          persist-credentials: false

      - name: Set up official Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Set up official build Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up actual Chrome and compatible ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Create activated environment and install native dependencies
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          python -m venv .venv
          source .venv/bin/activate
          python "$GITHUB_WORKSPACE/packet/.diagnostic/product38/guard_source.py" | tee "$GITHUB_WORKSPACE/evidence/source-before-build.log"
          python -m pip install --upgrade pip wheel
          python -m pip install 'setuptools<80.0.0'
          python -m pip install -e '.[dev,ci,testing]'
          npm ci

      - name: Run the full official build to generate native component assets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          npm run build

      - name: Verify immutable source, actual imports and actual tool versions
        working-directory: upstream
        shell: bash
        env:
          PRODUCT38_GUARD_IMPORTS: '1'
          DASH_TEST_CHROMEPATH: ${{ steps.chrome.outputs.chrome-path }}
          PRODUCT38_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python "$GITHUB_WORKSPACE/packet/.diagnostic/product38/guard_source.py" | tee "$GITHUB_WORKSPACE/evidence/source-after-build.log"
          {
            python --version
            python -m pip --version
            node --version
            npm --version
            "$DASH_TEST_CHROMEPATH" --version
            "$PRODUCT38_CHROMEDRIVER" --version
            command -v chromedriver
            git rev-parse HEAD
            git status --porcelain --untracked-files=no
          } | tee "$GITHUB_WORKSPACE/evidence/actual-tool-versions.log"

      - name: Run exactly six finite native cases and preserve real failure output
        working-directory: upstream
        shell: bash
        env:
          DASH_TEST_CHROMEPATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -uo pipefail
          set +e
          source .venv/bin/activate
          python -m pytest "$GITHUB_WORKSPACE/packet/.diagnostic/product38/test_patch_update_before.py" -c pytest.ini --headless --webdriver Chrome --nopercyfinalize -vv -s --tb=long --junitxml="$GITHUB_WORKSPACE/evidence/native-before.xml" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/native-before.log"
          test_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$test_exit" > "$GITHUB_WORKSPACE/evidence/pytest-exit.txt"
          echo "Actual pytest exit: $test_exit (expected1 from two real assertion failures)"

      - name: Require the predicted two assertion failures and four passing controls
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python "$GITHUB_WORKSPACE/packet/.diagnostic/product38/verify_before_results.py" "$GITHUB_WORKSPACE/evidence/native-before.xml" "$GITHUB_WORKSPACE/evidence/native-before.log" "$GITHUB_WORKSPACE/evidence/pytest-exit.txt" | tee "$GITHUB_WORKSPACE/evidence/result-verification.log"

      - name: Preserve post-test immutable-source guard
        if: always()
        working-directory: upstream
        shell: bash
        env:
          PRODUCT38_GUARD_IMPORTS: '1'
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python "$GITHUB_WORKSPACE/packet/.diagnostic/product38/guard_source.py" | tee "$GITHUB_WORKSPACE/evidence/source-after-tests.log"

